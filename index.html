<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#020617" />
    <meta name="description" content="MystiQ — Anonymous chat & discovery" />
    <title>MystiQ - Anonymous Chat</title>
    <style>
      html,
      body {
        margin: 0;
        background: #020617;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #020617;
        z-index: 9999;
      }
      #boot-splash .logo {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #c084fc;
      }
      #boot-splash .spin {
        width: 36px;
        height: 36px;
        border: 3px solid #7c3aed;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #boot-splash .hint {
        font-size: 12px;
        color: #94a3b8;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-splash.hide {
        display: none;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-x-hidden antialiased">
    <div id="boot-splash">
      <div class="logo">MYSTIQ</div>
      <div class="spin"></div>
      <div class="hint">Starting…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var el = document.getElementById('boot-splash');
          if (el) el.classList.add('hide');
        }, 400);
      });
    </script>
  </body>
      </html>
